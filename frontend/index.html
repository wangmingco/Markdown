<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkdownAK · 极简 Markdown 编辑器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="tabbar" id="tabbar">
    <div class="tabs" id="tabs"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><span class="bm-gold">M</span><span class="bm-teal">D</span></span>
      <span class="brand-name">Markdown<span class="brand-accent">AK</span></span>
    </div>

    <nav class="tools" id="toolbar">
      <button class="tool" data-cmd="bold" title="粗体"><b>B</b></button>
      <button class="tool" data-cmd="italic" title="斜体"><i>I</i></button>
      <button class="tool" data-cmd="strike" title="删除线"><s>S</s></button>
      <button class="tool" data-cmd="code" title="行内代码">&lt;/&gt;</button>
      <span class="divider"></span>
      <button class="tool" data-cmd="h1" title="一级标题">H1</button>
      <button class="tool" data-cmd="h2" title="二级标题">H2</button>
      <button class="tool" data-cmd="h3" title="三级标题">H3</button>
      <span class="divider"></span>
      <button class="tool" data-cmd="quote" title="引用">❝</button>
      <button class="tool" data-cmd="ul" title="无序列表">• 列表</button>
      <button class="tool" data-cmd="ol" title="有序列表">1. 列表</button>
      <button class="tool" data-cmd="task" title="任务列表">☑ 任务</button>
      <button class="tool" data-cmd="link" title="链接">🔗</button>
      <button class="tool" data-cmd="image" title="图片">🖼</button>
      <button class="tool" data-cmd="codeblock" title="代码块">```</button>
      <button class="tool" data-cmd="table" title="表格">▦</button>
    </nav>

    <div class="actions">
      <span class="preview-toggle">
        <button class="pv active" data-mode="split" title="分屏">⿲</button>
        <button class="pv" data-mode="edit" title="仅编辑">⿰</button>
        <button class="pv" data-mode="preview" title="仅预览">⿱</button>
      </span>
      <span class="divider"></span>
      <button class="action ghost" id="templateBtn" title="示例模板">模板</button>
      <button class="action ghost" id="wsBtn" title="工作区文件列表">文件</button>
      <button class="action ghost" id="tocBtn" title="目录">目录</button>
      <button class="action ghost" id="copyBtn" title="复制 Markdown">复制</button>
      <button class="action ghost" id="htmlBtn" title="复制 HTML">HTML</button>
      <button class="action ghost" id="printBtn" title="导出 PDF / 打印">导出</button>
      <button class="action ghost" id="exportBtn" title="代码 / 文档转图片">转图片</button>
      <button class="action ghost" id="newBtn" title="新建文档">新建</button>
      <button class="action ghost" id="openBtn" title="打开文件">打开</button>
      <button class="action ghost" id="saveBtn" title="保存文件">保存</button>
      <button class="action solid" id="themeBtn" title="切换主题">☾</button>
    </div>
  </header>

  <div class="layout">
    <aside class="ws-panel" id="wsPanel">
      <div class="ws-head">
        <span>工作区</span>
        <button id="addFolderBtn" class="tool" title="添加文件夹">＋</button>
      </div>
      <div class="ws-body" id="wsBody"></div>
    </aside>

    <aside class="toc-panel" id="tocPanel">
      <div class="toc-head">
        <span>目录</span>
        <button id="tocClose" class="tool">✕</button>
      </div>
      <div class="toc-body" id="tocBody"></div>
    </aside>

    <main class="workspace">
      <section class="pane pane-edit">
        <div class="pane-label">
          <span>MARKDOWN</span>
          <span class="counter" id="wordCount">0 字</span>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="在这里开始书写……"></textarea>
      </section>

      <div class="resizer" id="resizer"></div>

      <section class="pane pane-preview">
        <div class="pane-label">
          <span>PREVIEW</span>
        </div>
        <div class="preview" id="preview"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>

  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
      <p class="modal-title" id="modalTitle"></p>
      <div class="modal-input" id="modalInputWrap" hidden>
        <input id="modalInput" type="text" spellcheck="false" />
      </div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="export-mask" id="exportMask" hidden>
    <div class="export-panel">
      <div class="export-head">
        <span class="export-title">转图片 · Carbon 风格</span>
        <button class="export-close" id="exportClose" title="关闭">✕</button>
      </div>
      <div class="export-body">
        <div class="export-controls">
          <div class="export-group">
            <label>内容</label>
            <select id="exportSource">
              <option value="code">代码块</option>
              <option value="selection">选中内容</option>
              <option value="markdown">Markdown 全文</option>
            </select>
            <div id="exportBlockWrap" class="export-sub">
              <select id="exportBlock"></select>
            </div>
          </div>
          <div class="export-group">
            <label>文件标题</label>
            <input type="text" id="exportTitleInput" placeholder="未命名" />
          </div>
          <div class="export-group">
            <label>主题</label>
            <div class="theme-grid" id="themeGrid"></div>
          </div>
          <div class="export-group">
            <label>选项</label>
            <label class="export-check" id="exportLineNumWrap"><input type="checkbox" id="exportLineNum" checked /> 显示行号</label>
            <label class="export-check"><input type="checkbox" id="exportChrome" checked /> 窗口装饰</label>
            <p class="export-note" id="exportMdNote">Markdown 模式会按文档排版渲染，行号不可用。</p>
          </div>
          <button class="export-download" id="exportDownload">下载 PNG</button>
        </div>
        <div class="export-stage" id="exportStage">
          <div class="export-scaler" id="exportScaler"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
